}

.nf-content h1{

}

.nf-btn-primary{
  color:#211405; background: linear-gradient(120deg, var(--gold-bright), var(--gold) 45%, #e0b25f, var(--gold-bright));

.nf-btn-primary:hover{ transform: translateY(-2px); box-shadow: 0 18px 38px -12px rgba(179,130,47,.7); }

.nf-links a{ color: rgba(250,247,240,.72); }
